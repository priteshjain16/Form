<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title><link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
    <form action="" method="get">
        <h1 style="text-align: center;">con info</h1>
        <hr>

        <p>name: <br><input type="text" name="name" id="name"  placeholder:"enter your name" required></p>
        <p><fieldset >
            <legend>gender</legend>
            male <input type="radio" name="male" id="" required>
           female <input type="radio" name="female" id="">
        </fieldset></p>
        <p>address: 
            <br><textarea name="address" id="" placeholder:"enter your address" required ></textarea></p>
        <p>email: <br><input type="email" name="email" placeholder:"enter your email" required id=""></p>
        <p>pin code: <br><input type="number" required name="pin code" placeholder:"enter your pin code"  id=""></p>
      <hr>

        <h2 style="text-align: center;">pay info</h2>
        <hr>
        <p>card <br>
            <select name="card_type" id="" required>
                <option value="">select</option>
                <option value="1">1</option>
                <option value="2">2</option>
            </select>

        </p>
        <p>card number: <br><input type="number" name="card number" placeholder:"enter your card number" required id=""></p>
        <p>expiry date: <br><input type="date" name="expiry date" placeholder:"enter your card expiry date" required id=""></p>
        <p>cvv: <br><input type="number" name="cvv" placeholder:"enter your cvv" required id=""></p>
        <input type="submit" value="pay now">

    </form></div>
</body>
</html>
